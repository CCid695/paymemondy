apiVersion: v1
kind: Service
metadata:
  name: debug-k8s
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: debug-k8s
spec:
  type: ClusterIP
  selector:
    # This file is the CORRECT config — the pod label is `debug-k8s`.
    # K8s-level bugs are injected on the LIVE cluster by the debug-ctl pod
    # (the "Deploy" button in the web UI, see app/debugctl.py), never
    # committed here, so `./pmm deploy` always restores a healthy baseline.
    app.kubernetes.io/name: debug-k8s
  ports:
    - name: http
      port: 80
      targetPort: http

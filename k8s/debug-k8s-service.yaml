apiVersion: v1
kind: Service
metadata:
  name: debug-k8s
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: debug-k8s
spec:
  type: ClusterIP
  selector:
    # This file is the CORRECT config — the pod label is `debug-k8s`.
    # K8s-level bugs are introduced on the LIVE cluster by `break-k8s.sh`
    # (`make break-k8s TARGET=...`), never committed here, so `make deploy`
    # always restores a healthy baseline and `make break-k8s TARGET=reset`
    # heals whatever you broke.
    app.kubernetes.io/name: debug-k8s
  ports:
    - name: http
      port: 80
      targetPort: http

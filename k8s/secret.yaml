# Stripe secret TEMPLATE for the payment pod.
#
# This file is NOT applied by kustomize (see kustomization.yaml) — it only
# documents the shape of the Secret the payment pod expects.
#
# To create/update the real secret locally (secret key and/or publishable key):
#   ./pmm secret sk_test_xxxxxxxx              # secret key only
#   ./pmm secret sk_test_xxx pk_test_yyy       # both keys
#
# For production, do NOT use a committed manifest at all. Preferred options:
#   - External Secrets Operator syncing from AWS Secrets Manager / GCP Secret
#     Manager / Azure Key Vault
#   - HashiCorp Vault Agent Injector
#   - Sealed Secrets (Bitnami) if you must keep manifests in git
# Also enable envelope encryption of Secrets at rest on the cluster
# (Kubernetes EncryptionConfiguration with a KMS provider).
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: payment
type: Opaque
stringData:
  # NEVER commit real keys here. Placeholders only.
  STRIPE_SECRET_KEY: "sk_test_REPLACE_ME"
  # pk_ is public-by-design but we keep it out of git anyway — same Secret.
  STRIPE_PUBLISHABLE_KEY: "pk_test_REPLACE_ME"

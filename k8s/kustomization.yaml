apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  # secret.yaml is intentionally NOT here: it is a template only.
  # Create the real Secret with `./pmm secret sk_...`
  # so the key never lives in a file that can be committed.
  - deployment.yaml
  - service.yaml
  - payment-deployment.yaml
  - payment-service.yaml
  - debug-api-deployment.yaml
  - debug-api-service.yaml
  - debug-k8s-deployment.yaml
  - debug-k8s-service.yaml
  - rbac.yaml
  - debug-ctl-deployment.yaml
  - debug-ctl-service.yaml

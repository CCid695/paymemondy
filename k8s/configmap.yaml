apiVersion: v1
kind: ConfigMap
metadata:
  name: paymemoney-config
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: paymemoney
data:
  APP_NAME: "paymemoney"
  ENVIRONMENT: "local"
  # DNS name of the payment pod's Service (see payment-service.yaml).
  # Kubernetes resolves short names inside the same namespace.
  PAYMENT_SERVICE_URL: "http://payment"
  # NOTE: no Stripe keys here — both live in the `stripe-secret` Secret,
  # injected by `./pmm secret` (see k8s/secret.yaml). Nothing key-shaped
  # is committed to this repo.

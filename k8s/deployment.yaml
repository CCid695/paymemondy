apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymemoney
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: paymemoney
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: paymemoney
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paymemoney
    spec:
      containers:
        - name: paymemoney
          image: paymemoney:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: paymemoney-config
                  key: APP_NAME
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: paymemoney-config
                  key: PAYMENT_SERVICE_URL
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                configMapKeyRef:
                  name: paymemoney-config
                  key: STRIPE_PUBLISHABLE_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

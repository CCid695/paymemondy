# RBAC for the debug-ctl pod — the ONLY pod allowed to change the debug
# backends. Scoped to the paymemoney namespace, deployments + services only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-ctl
  namespace: paymemoney
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-ctl
  namespace: paymemoney
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-ctl
  namespace: paymemoney
subjects:
  - kind: ServiceAccount
    name: debug-ctl
    namespace: paymemoney
roleRef:
  kind: Role
  name: debug-ctl
  apiGroup: rbac.authorization.k8s.io

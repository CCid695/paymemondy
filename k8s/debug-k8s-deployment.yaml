apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-k8s
  namespace: paymemoney
  labels:
    app.kubernetes.io/name: debug-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: debug-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debug-k8s   # pod label
    spec:
      containers:
        - name: debug-k8s
          image: paymemoney:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.pay:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
